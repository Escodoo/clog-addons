<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#f5f5f5" rx="16"/>

  <!-- Thomson Reuters Blue -->
  <g id="dominio-logo">
    <!-- Outer Circle - Thomson Reuters Blue -->
    <circle cx="64" cy="64" r="60" fill="none" stroke="#003d82" stroke-width="3"/>

    <!-- Document Icon -->
    <g transform="translate(64, 64)">
      <!-- Document Page -->
      <rect x="-20" y="-30" width="40" height="50" rx="2" fill="#003d82"/>

      <!-- Document Lines (representing document content) -->
      <line x1="-14" y1="-22" x2="14" y2="-22" stroke="#ffffff" stroke-width="2"/>
      <line x1="-14" y1="-14" x2="14" y2="-14" stroke="#ffffff" stroke-width="2"/>
      <line x1="-14" y1="-6" x2="14" y2="-6" stroke="#ffffff" stroke-width="2"/>
      <line x1="-14" y1="2" x2="10" y2="2" stroke="#ffffff" stroke-width="2"/>

      <!-- Checkmark overlay (representing synchronized/stored) -->
      <g transform="translate(8, 12)">
        <circle cx="0" cy="0" r="12" fill="#28a745"/>
        <path d="M -4 0 L -1 3 L 4 -2" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Text underneath -->
    <text x="64" y="115" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#003d82">DOMÍNIO</text>
  </g>

  <!-- Border -->
  <rect width="128" height="128" fill="none" stroke="#d0d0d0" stroke-width="1" rx="16"/>
</svg>
